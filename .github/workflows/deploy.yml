name: Deploy Zoovita to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Admin Panel
        run: |
          cd admin-panel
          npm install
          npm run build

      - name: Build Web Site
        run: |
          cd web_site
          npm install
          npm run build

      - name: Clean Server Directories
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            rm -rf /var/www/zoovita/*
            rm -rf /var/www/zoovita-site/*

      - name: Copy Admin Panel
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "admin-panel/dist/*"
          target: "/var/www/zoovita/"
          strip_components: 2

      - name: Copy Web Site
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "web_site/dist/*"
          target: "/var/www/zoovita-site/"
          strip_components: 2

      - name: Update Backend and Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            bash /root/zoovita/deploy.sh
